<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex LAN Notify</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>Codex LAN Notify</h1><p>远程 Codex 内网提醒</p></div><span id="status" class="status"></span></header>
<nav><button data-page="connection" class="active">接入与状态</button><button data-page="events">事件设置</button><button data-page="history">近期记录</button></nav>
<main><div id="error" role="alert" hidden></div><section id="connection"><h2>桌面接收器</h2><p>让 Linux 服务器能够访问本机 IP 和端口。仅在可信内网使用。</p><div class="grid"><label>监听地址<input id="host" autocomplete="off"></label><label>端口<input id="port" type="number" min="1" max="65535"></label></div><p>本机内网地址：<strong id="addresses"></strong></p><label>认证 Key<div class="keyrow"><input id="key" readonly type="password"><button id="showkey">显示</button><button id="copykey">复制</button><button id="rotate">重置</button></div></label><p class="hint">重置后需要同步更新 Linux 配置。Key 和通知内容通过 HTTP 明文传输。</p><div class="actions"><button id="save" class="primary">保存设置</button><button id="test">测试本机通知</button></div><h3>Linux 配置示例</h3><pre id="config-example"></pre><p class="hint">将示例保存为 ~/.config/codex-hook/config.json；详见项目 README。</p></section>
<section id="events" hidden><h2>通知事件</h2><p>关闭的事件仍记录，但不会弹出通知。</p><label class="pause"><input type="checkbox" id="paused"> 暂停所有提醒</label><div id="event-list" class="event-list"></div><button id="save-events" class="primary">保存事件设置</button></section>
<section id="history" hidden><div class="history-title"><div><h2>近期记录</h2><p>最多保存 500 条。</p></div><button id="clear">清空记录</button></div><div id="records"></div></section></main><script src="renderer.js"></script></body></html>
